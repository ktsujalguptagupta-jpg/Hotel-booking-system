<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Details - Hotel Booking System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <div class="header-content">
      <h1>Hotel Booking System</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">View Rooms</a>
        <a href="my-bookings.html">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="roomDetail"></div>

    <div class="availability-box">
      <h3>Check Availability</h3>
      <form id="availabilityForm" style="margin-top: 1rem">
        <div class="form-grid">
          <div class="form-group">
            <label for="checkIn">Check-In Date</label>
            <input type="date" id="checkIn" required />
          </div>
          <div class="form-group">
            <label for="checkOut">Check-Out Date</label>
            <input type="date" id="checkOut" required />
          </div>
        </div>
        <button type="button" id="checkAvailBtn" class="btn">Check Availability</button>
      </form>
      <div id="availabilityResult" class="availability-result"></div>
    </div>

    <div style="text-align: center; margin-top: 2rem">
      <a href="rooms.html" class="btn btn-secondary">Back to Rooms</a>
      <a id="bookBtn" href="#" class="btn">Book This Room</a>
    </div>
  </main>

  <script type="module" src="js/detail.js"></script>
</body>

</html>
