<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Room - Hotel Booking System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <div class="header-content">
      <h1>Hotel Booking System</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">View Rooms</a>
        <a href="my-bookings.html">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <h2>Complete Your Booking</h2>
      <div id="roomSummary"></div>

      <form id="bookingForm" style="margin-top: 2rem">
        <input type="hidden" id="roomIdInput" name="room_id" />
        <input type="hidden" id="pricePerNight" />

        <div class="form-grid">
          <div class="form-group">
            <label for="checkIn">Check-In</label>
            <input type="date" id="checkIn" name="check_in" required />
          </div>
          <div class="form-group">
            <label for="checkOut">Check-Out</label>
            <input type="date" id="checkOut" name="check_out" required />
          </div>
          <div class="form-group">
            <label for="adults">Adults</label>
            <select id="adults" name="adults">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="form-group">
            <label for="children">Children</label>
            <select id="children" name="children">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>
        </div>

        <h3 style="margin: 2rem 0 1rem">Guest Information</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="guest_name">Full Name</label>
            <input type="text" id="guest_name" name="guest_name" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="guest_email">Email</label>
            <input type="email" id="guest_email" name="guest_email" placeholder="john@example.com" required />
          </div>
          <div class="form-group" style="grid-column: 1/-1">
            <label for="guest_phone">Phone (Optional)</label>
            <input type="tel" id="guest_phone" name="guest_phone" placeholder="+31 6 12345678" />
          </div>
        </div>

        <div id="errorMsg" class="availability-result error" style="display: none"></div>
        <div id="successMsg" class="availability-result success" style="display: none"></div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: space-between">
          <a href="rooms.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" id="submitBtn" class="btn btn-success">Confirm Booking</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/booking.js"></script>
</body>

</html>
