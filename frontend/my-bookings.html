<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - Hotel Booking System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <div class="header-content">
      <h1>Hotel Booking System</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">View Rooms</a>
        <a href="my-bookings.html">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 style="margin-bottom: 1rem">My Bookings</h2>
    <p style="color: var(--text-light); margin-bottom: 1.5rem">
      <span id="bookingsCount">0</span> bookings found
    </p>

    <div id="bookingsContainer"></div>
  </main>

  <script type="module">
    import { API } from './js/api.js';

    function formatPrice(price) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(price);
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-IN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    async function loadBookings() {
      const container = document.getElementById('bookingsContainer');
      container.innerHTML = '<div class="loading">Loading bookings...</div>';

      try {
        const data = await API.getBookings();
        document.getElementById('bookingsCount').textContent = data.total;

        if (data.bookings.length === 0) {
          container.innerHTML = '<div class="empty-state"><h3>No bookings found</h3><p>Book a room to see your reservations here.</p></div>';
          return;
        }

        container.innerHTML = data.bookings.map(b => {
          const nights = Math.ceil((new Date(b.check_out) - new Date(b.check_in)) / (1000 * 60 * 60 * 24));
          return `
          <div class="room-card" style="margin-bottom: 1rem">
            <div class="room-card-content">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.5rem">
                <h3>${b.hotel_name}</h3>
                <span class="badge ${b.status === 'confirmed' ? 'badge-success' : 'badge-danger'}">${b.status}</span>
              </div>
              <span class="room-type">${b.room_type}</span>
              <p class="meta">${b.place || ''}${b.city ? ' • ' + b.city : ''}${b.state ? ', ' + b.state : ''}</p>
              <div class="info-grid" style="margin:1rem 0">
                <div class="info-item">
                  <div class="info-label">Booking ID</div>
                  <div class="info-value">#${b.id}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Check-In</div>
                  <div class="info-value">${formatDate(b.check_in)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Check-Out</div>
                  <div class="info-value">${formatDate(b.check_out)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Nights</div>
                  <div class="info-value">${nights}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Total</div>
                  <div class="info-value">${formatPrice(b.total_price)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Guests</div>
                  <div class="info-value">${b.adults} Adults, ${b.children} Children</div>
                </div>
              </div>
              <div class="card-actions">
                <a href="confirmation.html?bookingId=${b.id}" class="btn btn-secondary">View Details</a>
                ${b.status === 'confirmed' ? `<button class="btn btn-danger cancel-btn" data-id="${b.id}">Cancel Booking</button>` : ''}
              </div>
            </div>
          </div>
          `;
        }).join('');

        document.querySelectorAll('.cancel-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            if (confirm('Are you sure you want to cancel this booking?')) {
              btn.disabled = true;
              btn.textContent = 'Cancelling...';
              try {
                await API.cancelBooking(id);
                alert('Booking cancelled successfully.');
                loadBookings();
              } catch (err) {
                alert('Failed to cancel: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Cancel Booking';
              }
            }
          });
        });
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><h3>Error</h3><p>${err.message}</p></div>`;
      }
    }

    loadBookings();
  </script>
</body>

</html>
